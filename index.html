// ─── STATE ────────────────────────────────────────────────────
function initSets(plan){
  const s={};
  plan.days.forEach(d=>{s[d.day]={};d.exercises.forEach((_,i)=>{s[d.day][i]={sets:Array(_.sets).fill(false),weight:"",swapped:false};});});
  return s;
}
function loadState(){
  try{
    const raw=localStorage.getItem('grind_v4');
    if(raw){const s=JSON.parse(raw);if(!s.sets.bulk)s.sets.bulk=initSets(PLANS.bulk);if(!s.sets.cut)s.sets.cut=initSets(PLANS.cut);return s;}
  }catch(e){}
  return{
    planId:'bulk',sets:{bulk:initSets(PLANS.bulk),cut:initSets(PLANS.cut)},
    history:[],prs:{},
    profile:{name:'',goal:'HYPERTROPHY',startDate:todayStr(),streak:0,lastWeek:'',hardWeeks:0},
    restDur:90,checkins:{},measurements:[],homeMode:false,
    accentColor:'#ff3c3c',sessionNotes:[],
  };
}
function saveState(){try{localStorage.setItem('grind_v4',JSON.stringify(ST));}catch(e){}}
let ST=loadState();

// ─── UTILS ────────────────────────────────────────────────────
function todayStr(){return new Date().toISOString().split('T')[0];}
function weekKey(){const n=new Date();const d=n.getDay();const m=new Date(n);m.setDate(n.getDate()-(d===0?6:d-1));return m.toISOString().split('T')[0];}
function getDaysInMonth(y,m){return new Date(y,m+1,0).getDate();}
function getFirstDay(y,m){return new Date(y,m,1).getDay();}
const now=new Date();
const todayWD=now.getDay();
const quoteIdx=Math.floor(Math.random()*MANTRAS.length);

function plan(){return PLANS[ST.planId];}
function planSets(){return ST.sets[ST.planId];}
function wdMap(){return WD_MAP[ST.planId];}
function todayPlanDay(){return wdMap()[todayWD]||null;}
function todayPlanData(){const d=todayPlanDay();return d?plan().days.find(p=>p.day===d):null;}
function AC(){return ST.accentColor;}

function dayProg(day){
  const d=plan().days.find(p=>p.day===day);if(!d)return{done:0,total:0,pct:0};
  let done=0,total=0;
  d.exercises.forEach((_,ei)=>{total+=_.sets;done+=(planSets()[day]?.[ei]?.sets||[]).filter(Boolean).length;});
  return{done,total,pct:total?Math.round((done/total)*100):0};
}
function weekPct(){let d=0,t=0;plan().days.forEach(p=>{const x=dayProg(p.day);d+=x.done;t+=x.total;});return t?Math.round((d/t)*100):0;}
function sessionVolume(day){
  const d=plan().days.find(p=>p.day===day);if(!d)return 0;let vol=0;
  d.exercises.forEach((_,ei)=>{const exS=planSets()[day]?.[ei];const w=parseFloat(exS?.weight||0);const rL=parseInt((_.reps+'').split('-')[0])||1;vol+=w*(exS?.sets||[]).filter(Boolean).length*rL;});
  return Math.round(vol);
}
function totalWeekVolume(){return plan().days.reduce((s,d)=>s+sessionVolume(d.day),0);}
function getOverloadSugg(day,ei){
  const ex=plan().days.find(p=>p.day===day)?.exercises[ei];if(!ex)return null;
  const w=parseFloat(planSets()[day]?.[ei]?.weight||0);if(!w)return null;
  const past=ST.history.filter(h=>h.day===day&&h.planId===ST.planId);
  if(past.length>=1&&planSets()[day]?.[ei]?.sets.every(Boolean))return`+2.5kg → try ${(w+2.5).toFixed(1)}kg`;
  return null;
}
function getPlanForDate(date){const wd=date.getDay();const pd=wdMap()[wd];return pd?plan().days.find(p=>p.day===pd):null;}

// ─── ACTIONS ──────────────────────────────────────────────────
function showToast(msg,color='#fff',dur=3000){
  clearTimeout(toastTO);toastData={msg,color};R();
  toastTO=setTimeout(()=>{toastData=null;R();},dur);
}
function startRest(){
  stopRest();restTimer={remaining:ST.restDur,total:ST.restDur};
  restInterval=setInterval(()=>{
    if(!restTimer||restTimer.remaining<=0){stopRest();showToast('REST OVER — NEXT SET!','#00e676');return;}
    restTimer.remaining--;R();
  },1000);
  if(navigator.vibrate)navigator.vibrate(50);
}
function stopRest(){clearInterval(restInterval);restTimer=null;}
function toggleSet(day,ei,si){
  if(!planSets()[day]?.[ei])return;
  const cur=planSets()[day][ei].sets[si];
  planSets()[day][ei].sets[si]=!cur;
  if(!cur){
    const ex=plan().days.find(p=>p.day===day)?.exercises[ei];
    if(ex){
      const w=parseFloat(planSets()[day][ei].weight||0);
      if(w>0){const key=ex.id;if(!ST.prs[key]||w>ST.prs[key]){ST.prs[key]=w;showPRData={name:ST.homeMode&&HOME_EX[ex.id]?HOME_EX[ex.id].name:ex.name,weight:w,accent:plan().days.find(p=>p.day===day).accent};clearTimeout(showPRTO);showPRTO=setTimeout(()=>{showPRData=null;R();},3000);}}
    }
    startRest();
    const date=todayStr();
    if(!ST.history.find(h=>h.date===date&&h.day===day&&h.planId===ST.planId)){ST.history.unshift({date,day,planId:ST.planId});if(ST.history.length>300)ST.history=ST.history.slice(0,300);}
  } else stopRest();
  saveState();R();
}
function resetDay(day){plan().days.find(d=>d.day===day)?.exercises.forEach((_,ei)=>{if(planSets()[day]?.[ei])planSets()[day][ei].sets=Array(_.sets).fill(false);});saveState();R();}
function swapEx(day,ei){if(planSets()[day]?.[ei])planSets()[day][ei].swapped=!planSets()[day][ei].swapped;showAltFor=null;saveState();R();}
function deloadCheck(){
  const wk=weekKey();
  if(ST.profile.lastWeek!==wk&&weekPct()===100){ST.profile.streak++;ST.profile.hardWeeks++;ST.profile.lastWeek=wk;if(ST.profile.hardWeeks>=4)showDeload=true;saveState();}
}
function exportCSV(){
  const rows=[['Date','Plan','Day','Exercise','Sets Done','Weight(kg)','Volume(kg)']];
  ST.history.forEach(h=>{const p=PLANS[h.planId||'bulk'];const d=p?.days.find(d=>d.day===h.day);if(!d)return;d.exercises.forEach((ex,ei)=>{const exS=ST.sets[h.planId||'bulk']?.[h.day]?.[ei];const done=(exS?.sets||[]).filter(Boolean).length;const w=parseFloat(exS?.weight||0);rows.push([h.date,h.planId,d.label,ex.name,done,w,Math.round(done*w*(parseInt((ex.reps+'').split('-')[0])||1))]);});});
  const csv=rows.map(r=>r.join(',')).join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download='grind_log.csv';a.click();
}
async function sendAI(){
  if(!aiInput.trim()||aiLoading)return;
  aiLoading=true;aiReply='';R();
  const tp=todayPlanData();
  const sys=`You are a sharp, no-nonsense personal trainer inside GRIND, a workout app. Plan: ${plan().name} (${plan().desc}). Today: ${tp?.label||'Rest'}. Mode: ${ST.homeMode?'Home (DBs+bands+BW)':'Gym (full equipment)'}. Give crisp, actionable feedback in 2-4 sentences. Be direct and motivating.`;
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:sys,messages:[{role:'user',content:aiInput}]})});
    const data=await res.json();
    aiReply=data.content?.[0]?.text||'Could not get response.';
    ST.sessionNotes.unshift({date:todayStr(),note:aiInput,reply:aiReply});
    if(ST.sessionNotes.length>20)ST.sessionNotes=ST.sessionNotes.slice(0,20);

  }catch(e){aiReply='Connection error. Check your internet.';}
  aiLoading=false;R();
}

function h(tag,attrs={},children=[]){
  const el=document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==='style'&&typeof v==='object')Object.assign(el.style,v);
    else if(k.startsWith('on'))el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==='class')el.className=v;
    else el.setAttribute(k,v);
  });
  [].concat(children).forEach(c=>{if(c==null)return;typeof c==='string'?el.appendChild(document.createTextNode(c)):c instanceof Node&&el.appendChild(c);});
  return el;
}

    form.appendChild(D({fontSize:'8px',color:'#333',letterSpacing:'2px',marginBottom:'7px'},['TRAINING GOAL']));
    const gg=D({display:'grid',gridTemplateColumns:'1fr 1fr',gap:'7px',marginBottom:'14px'});
    ['STRENGTH','HYPERTROPHY','ENDURANCE','WEIGHT LOSS'].forEach(g=>gg.appendChild(B({padding:'10px',borderRadius:'9px',border:`2px solid ${profileDraft.goal===g?ac:'#111'}`,background:profileDraft.goal===g?`${ac}15`:'#000',color:profileDraft.goal===g?ac:'#333',fontSize:'11px',fontWeight:'700',letterSpacing:'1px',cursor:'pointer'},()=>{profileDraft.goal=g;R();},g)));
    form.appendChild(gg);
    form.appendChild(B({width:'100%',padding:'12px',borderRadius:'10px',border:`1px solid ${ac}`,background:`${ac}15`,color:ac,fontSize:'12px',fontWeight:'700',letterSpacing:'2px',cursor:'pointer'},()=>{ST.profile={...ST.profile,...profileDraft};profileEdit=false;saveState();showToast('PROFILE SAVED.',ac);},'SAVE PROFILE'));
    ct.appendChild(form);
  } else {
    ct.appendChild(D({background:'#080808',border:'1px solid #111',borderRadius:'14px',padding:'18px',marginBottom:'14px'},[
      D({fontSize:'28px',fontWeight:'900',color:ac,lineHeight:'1'},[ST.profile.name||'ATHLETE']),
      D({fontSize:'9px',color:'#333',letterSpacing:'2px',marginTop:'4px'},[ST.profile.goal]),
      D({marginTop:'14px',display:'flex',gap:'14px'},[
        D({}),[D({fontSize:'7px',color:'#222',letterSpacing:'2px'},['SINCE']),D({fontSize:'12px',fontWeight:'900',color:'#555'},[ST.profile.startDate])],
        D({}),[D({fontSize:'7px',color:'#222',letterSpacing:'2px'},['STREAK']),D({fontSize:'12px',fontWeight:'900',color:'#ff6a00'},[ST.profile.streak+'🔥'])],
        D({}),[D({fontSize:'7px',color:'#222',letterSpacing:'2px'},['SESSIONS']),D({fontSize:'12px',fontWeight:'900',color:'#3c8eff'},[String(new Set(ST.history.map(h=>h.date)).size)])],
        D({}),[D({fontSize:'7px',color:'#222',letterSpacing:'2px'},['HARD WKS']),D({fontSize:'12px',fontWeight:'900',color:ST.profile.hardWeeks>=4?'#ff3c3c':'#555'},[String(ST.profile.hardWeeks)])],
      ]),
    ]));
  }
  // Install prompt
  const ib=D({background:'#080808',border:'1px solid #111',borderRadius:'14px',padding:'14px',marginBottom:'14px'});
  ib.innerHTML=`<div style="font-size:8px;color:#2a2a2a;letter-spacing:2px;margin-bottom:8px">INSTALL AS APP</div><div style="font-size:12px;color:#444;line-height:1.6;margin-bottom:10px">On iOS: tap the Share button → "Add to Home Screen"<br>On Android: tap the menu → "Install app" or "Add to Home Screen"</div>`;
  ct.appendChild(ib);
  // Mantras
  const mn=D({background:'#080808',border:'1px solid #111',borderRadius:'14px',padding:'16px'});
  mn.appendChild(D({fontSize:'8px',color:'#2a2a2a',letterSpacing:'2px',marginBottom:'10px'},['MANTRAS']));
  MANTRAS.forEach((q,i)=>{const m=D({padding:'8px 0',borderBottom:'1px solid #060606',fontSize:'12px',fontWeight:'900',color:i===quoteIdx?ac:'#1a1a1a',letterSpacing:'0.5px'});m.textContent=(i===quoteIdx?'▶ ':'   ')+q;mn.appendChild(m);});
  ct.appendChild(mn);
}

// ─── BOOT ──────────────────────────────────────────────────
R();
</script>
