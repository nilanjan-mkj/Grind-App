// ─── CLOUD SYNC ───────────────────────────────────────────────────────────────
async function cloudSave(url,userId,data){
  try{
    const r=await fetch(url,{
      method:"POST",
      headers:{"Content-Type":"text/plain"},
      body:JSON.stringify({userId,data:JSON.stringify(data)}),
      redirect:"follow"
    });
    const t=await r.text();
    try{return JSON.parse(t);}catch{return{ok:false,error:"Bad response: "+t.slice(0,120)};}
  }catch(e){return{ok:false,error:e.message};}
}
async function cloudLoad(url,userId){
  try{
    const r=await fetch(`${url}?action=load&userId=${encodeURIComponent(userId)}`,{redirect:"follow"});
    const t=await r.text();
    try{return JSON.parse(t);}catch{return{ok:false,error:"Bad response: "+t.slice(0,120)};}
  }catch(e){return{ok:false,error:e.message};}
}

function lsSaveSync(cfg){try{localStorage.setItem(SK_SYNC,JSON.stringify(cfg));}catch{}}
function lsLoadSync(){try{const r=localStorage.getItem(SK_SYNC);return r?JSON.parse(r):null;}catch{return null;}}

function Sparkline({data,color,height=44}){
  if(!data||data.length<2)return <div style={{height,display:"flex",alignItems:"center"}}><span style={{fontSize:10,color:"#1a1a1a"}}>Log more data to see trend</span></div>;
  const w=300,h=height,pad=4,min=Math.min(...data),max=Math.max(...data),range=max-min||1;
  const pts=data.map((v,i)=>`${pad+(i/(data.length-1))*(w-pad*2)},${h-pad-(((v-min)/range)*(h-pad*2))}`).join(" ");
  const lx=pad+((data.length-1)/(data.length-1))*(w-pad*2);
  const ly=h-pad-(((data[data.length-1]-min)/range)*(h-pad*2));
  return(<svg viewBox={`0 0 ${w} ${h}`} style={{width:"100%",height}} preserveAspectRatio="none"><polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/><circle cx={lx} cy={ly} r="3.5" fill={color}/></svg>);
}

                <div style={{fontSize:"clamp(14px,4vw,16px)",fontWeight:700,color:allDone?d.accent:"#e8e8e8",transition:"color .3s",lineHeight:1.25}}>{resolved.name}</div>
                {isPR&&<span style={{fontSize:12}}>🏆</span>}
                {resolved.tag&&<span style={{fontSize:9,color:resolved.tag==="HOME"?"#4D9FFF":d.accent,fontWeight:700,border:`1px solid ${resolved.tag==="HOME"?"#4D9FFF30":d.accent+"30"}`,padding:"2px 5px",borderRadius:4,flexShrink:0}}>{resolved.tag}</span>}
              </div>
              <div style={{fontSize:10,color:allDone?d.accent+"80":"#2a2a2a",fontWeight:600,transition:"color .3s"}}>{ex.sets} × {ex.reps}{doneCnt>0&&!allDone&&<span style={{color:d.accent,marginLeft:8}}>{doneCnt}/{ex.sets} done</span>}{allDone&&<span style={{marginLeft:8}}>· Complete</span>}</div>
              {sugg&&<div style={{fontSize:10,color:d.accent,marginTop:3,fontWeight:700}}>↑ {sugg}</div>}
            </div>
            <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6,flexShrink:0}}>
              <div style={{display:"flex",alignItems:"center",gap:4}}><input type="number" inputMode="decimal" placeholder="—" value={exState.weight||""} onChange={e=>setWeight(day,ei,e.target.value)} style={{width:52,padding:"8px 0",borderRadius:8,border:`1px solid ${exState.weight?d.accent+"50":"#141414"}`,background:"#000",color:exState.weight?d.accent:"#555",fontSize:15,fontWeight:700,textAlign:"center",fontFamily:"'Barlow Condensed',sans-serif",transition:"all .2s",outline:"none"}}/><span style={{fontSize:9,color:"#1a1a1a",fontWeight:700}}>KG</span></div>
              {!homeMode&&<button onClick={()=>setShowAltFor(showAltFor===`${day}-${ei}`?null:`${day}-${ei}`)} style={{fontSize:9,color:"#2a2a2a",background:"none",border:"none",cursor:"pointer",fontWeight:700}}>ALT ⇄</button>}
            </div>
          </div>
          <ExInfo exId={ex.id} accent={d.accent} homeMode={homeMode}/>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:10}}>
            {(exState.sets||[]).map((done,si)=>(
              <button key={si} className="setbtn" onClick={()=>toggleSet(day,ei,si)} style={{width:"clamp(40px,11vw,48px)",height:"clamp(40px,11vw,48px)",borderRadius:10,border:`1.5px solid ${done?d.accent:"#161616"}`,background:done?d.accent:"#000",cursor:"pointer",boxShadow:done?`0 0 12px ${d.accent}60`:"none",transition:"all .15s ease",display:"flex",alignItems:"center",justifyContent:"center",touchAction:"manipulation"}}>
                {done?(<svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M1.5 6L6 10.5L14.5 1.5" stroke="#000" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>):<span style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:16,fontWeight:900,color:"#2a2a2a",lineHeight:1}}>{si+1}</span>}
              </button>
            ))}
          </div>
        </div>);
      })}
    </>);
  }
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
